name: annalog
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  # Versions mirror ANNalog's seq2seq_environment.yml at the pinned commit
  # 0b2c21783749b8d1296efbb0263900c94a2c1a6f. In particular, ANNalog imports
  # torchtext.legacy, which is available in torchtext 0.10.1 but not 0.6.0.
  - python=3.9.2
  - numpy=1.20.3
  - pandas=1.3.3
  - tqdm=4.60.0
  - pytorch=1.9.1
  - torchvision=0.10.1
  - torchtext=0.10.1
  - rdkit=2021.09.4
  - scikit-learn=1.2.2
  - pip
  - pip:
      # ANNalog 0.5 is installed from the pinned upstream Git commit after
      # creating this environment. See examples/annalog_workflow/README.md.
      - partialsmiles==2.0
